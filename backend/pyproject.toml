[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "backend"
version = "0.1.0"
description = "FastAPI backend for the Smart Farming diagnostic pipeline"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24.0",
    "pyyaml>=6.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.16.0",
    "python-dotenv>=1.2.4",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.54.0",
    "gunicorn>=26.2.0",
    "uvicorn-worker>=0.3.0",
    "certifi>=2026.10.19",
    "python-multipart>=0.0.6",
    "httpx>=0.25.0",
    "requests>=2.31.0",
    "urllib3>=2.8.0",
    "slowapi>=0.1.9",
    "sqlalchemy>=2.0.0",
    "alembic>=1.14.0",
    "psycopg2-binary>=2.9.13",
    "psycopg[binary]>=3.3.6",
    "PyJWT>=2.15.0",
    "pwdlib[argon2]>=0.3.1",
    "passlib[bcrypt]>=1.7.4",
    "apscheduler>=3.10.0",
    "redis>=5.0.0",
    "arq>=0.26.0",
    "pillow>=13.0.0",
    "shapely>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.0.0",
    "pytest-mock>=3.14.0",
    "pip-audit>=2.10.0,<3.0.0",
    "opencv-python-headless>=5.0.0.93,<5.1",
    "ruff>=0.14.0,<1.0.0",
    "mypy>=2.4.0,<3.0.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
ignore = ["E402", "E712", "F401", "F841", "B008", "B904", "B905"]

[tool.ruff.lint.per-file-ignores]
"backend/src/app/models/*.py" = ["F821"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
follow_imports = "silent"
check_untyped_defs = true

[tool.fastapi]
entrypoint = "app.main:app"

[tool.setuptools.packages.find]
where = ["src"]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["src", "..", "../ai_service"]
