[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "backend"
version = "0.1.0"
description = "FastAPI backend for the Smart Farming diagnostic pipeline"
requires-python = ">=3.14"
dependencies = [
    "numpy>=1.24.0",
    "pyyaml>=6.0",
    "opencv-python>=4.7.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "timm>=0.9.0",
    "albumentations>=1.3.0",
    "ultralytics>=8.0.0",
    "fastapi[standard]>=0.141.1",
    "python-multipart>=0.0.6",
    "python-dotenv>=1.0.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "pyjwt>=2.8.0",
    "pwdlib[argon2]>=0.2.0",
    "uvicorn[standard]>=0.22.0",
    "pytest>=8.0.0",
    "passlib>=1.7.4",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.0.0",
]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.setuptools.packages.find]
where = ["src"]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["src"]

