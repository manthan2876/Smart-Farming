[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "backend"
version = "0.1.0"
description = "FastAPI backend for the Smart Farming diagnostic pipeline"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "pyyaml>=6.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.22.0",
    "python-multipart>=0.0.6",
    "httpx>=0.25.0",
    "requests>=2.31.0",
    "slowapi>=0.1.9",
    "sqlalchemy>=2.0.0",
    "alembic>=1.14.0",
    "psycopg2-binary>=2.9.0",
    "psycopg[binary]>=3.1.0",
    "PyJWT>=2.8.0",
    "pwdlib[argon2]>=0.2.0",
    "passlib[bcrypt]>=1.7.4",
    "apscheduler>=3.10.0",
    "redis>=5.0.0",
    "arq>=0.26.0",
    "pillow>=10.2.0",
    "shapely>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.0.0",
]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.setuptools.packages.find]
where = ["src"]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
