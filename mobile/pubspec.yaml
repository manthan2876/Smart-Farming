name: smart_farming_mobile
description: Camera-first offline-ready Smart Farming client.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  connectivity_plus: ^7.3.2
  dio: ^5.7.0
  http: ^1.3.0
  image_picker: ^1.2.4
  shared_preferences: ^2.5.6
  flutter_secure_storage: ^11.2.0
  flutter_tts: ^4.2.2
  audioplayers: ^6.1.0

  cupertino_icons: ^2.0.0
  http_parser: ^4.1.2
  web_socket_channel: ^3.0.3
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  sqflite: ^2.4.4+1
  path_provider: ^2.1.6
  path: ^1.9.1
  smart_farming_api:
    path: api_client

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
