# ==============================================================================
# render.yaml — Render Monorepo Blueprint Configuration
# ==============================================================================

services:
  - type: web
    name: smart-farming-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install uv==0.13.0 && uv sync --locked --system --no-dev --no-install-project
    startCommand: gunicorn app.main:app --workers ${WEB_CONCURRENCY:-1} --worker-class uvicorn_worker.UvicornWorker --bind 0.0.0.0:$PORT --chdir src --timeout 150 --access-logfile - --error-logfile -
    healthCheckPath: /ready
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://smart-farming-dashboard.vercel.app,https://smart-farming-dashboard-green.vercel.app
      - key: AI_SERVICE_URL
        value: https://maharsh8805-smart-farming-ai.hf.space
      - key: GATEWAY_API_KEY
        sync: false
      - key: WEB_CONCURRENCY
        value: "1"
    buildFilter:
      paths:
        - backend/**
      ignoredPaths:
        - frontend/**
        - ai_service/**
        - mobile/**
        - Docs/**
        - notebooks/**
        - "*.md"
