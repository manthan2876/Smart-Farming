name: "Feature Request"
description: "Suggest an idea or new capability for Smart Farming"
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a feature! Please describe your proposal clearly.

  - type: dropdown
    id: component
    attributes:
      label: Target Component
      description: Which subsystem will this feature enhance?
      options:
        - "Backend API & Database"
        - "AI Computer Vision & MLOps"
        - "Frontend Web Dashboard"
        - "Mobile App (Flutter)"
        - "Agronomic Knowledge Base"
        - "Observability & Infrastructure"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem or user challenge?
      placeholder: "Farmers currently struggle to..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: A clear and concise description of what you want to happen.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or features you've considered.

