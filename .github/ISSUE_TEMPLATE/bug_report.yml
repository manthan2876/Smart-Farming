name: "Bug Report"
description: "File a bug or unexpected behavior in Smart Farming"
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please provide as much context as possible.

  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      description: Which part of the system is experiencing the issue?
      options:
        - "Backend API (FastAPI)"
        - "AI Inference Service (YOLO / PyTorch)"
        - "Frontend Dashboard (React / Vite)"
        - "Mobile App (Flutter)"
        - "Database / Migrations (PostgreSQL / Alembic)"
        - "CI/CD & Deployment Workflows"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: "When submitting a scan from the mobile app..."
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Detailed steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs or Error Output
      description: Please copy and paste any relevant logs, terminal output, or stack traces.
      render: shell
