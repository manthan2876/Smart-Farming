version: 2
enable-beta-ecosystems: true

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    groups:
      react:
        patterns:
          - "react*"
          - "@types/react*"

  - package-ecosystem: npm
    directory: /tools/openapi-codegen
    schedule:
      interval: monthly
    ignore:
      - dependency-name: "typescript"
        versions: [">= 6.0.0"]

  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: monthly

  - package-ecosystem: pip
    directory: /ai_service
    schedule:
      interval: monthly
    ignore:
      - dependency-name: "torch"
        versions: ["> 2.13.0"]

  - package-ecosystem: pub
    directory: /mobile
    schedule:
      interval: monthly

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: monthly

  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: monthly

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: monthly
