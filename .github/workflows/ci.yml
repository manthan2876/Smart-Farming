name: Continuous Integration & Verification

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'ai_service/**'
      - 'frontend/**'
      - 'mobile/**'
      - 'Docs/**'
      - '.github/workflows/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database-migration-test:
    name: Alembic PostgreSQL Migration & Reversibility Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_smart_farming
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install uv==0.13.0
          uv sync --project backend --locked --no-dev

      - name: Test Migration Cycle (Upgrade -> Downgrade -> Upgrade)
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_smart_farming
          PYTHONPATH: backend/src:ai_service
        run: |
          cd backend
          echo "Step 1: Upgrade to head..."
          uv run --project . --locked --no-dev alembic upgrade head
          echo "Step 2: Downgrade to base..."
          uv run --project . --locked --no-dev alembic downgrade base
          echo "Step 3: Re-upgrade to head..."
          uv run --project . --locked --no-dev alembic upgrade head
          echo "Alembic migrations verified successfully!"

  backend-tests:
    name: Backend Tests & Rigor
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install uv==0.13.0
          uv sync --project backend --locked --extra dev

      - name: Audit locked backend runtime dependencies
        run: |
          uv export --project backend --locked --no-dev --no-emit-project \
            --format requirements-txt --output-file "$RUNNER_TEMP/backend-requirements.txt"
          uv run --project backend --locked --extra dev pip-audit \
            --requirement "$RUNNER_TEMP/backend-requirements.txt" \
            --require-hashes --disable-pip --progress-spinner off

      - name: Lint Python code
        run: |
          uv run --project backend --locked --extra dev ruff check \
            --config backend/pyproject.toml \
            backend/src backend/tests ai_service

      - name: Type-check focused backend and AI modules
        run: |
          uv run --project backend --locked --extra dev mypy \
            --config-file backend/pyproject.toml \
            backend/src/app/core/paths.py \
            ai_service/vision_engine/stages/confidence.py

      - name: Run Pytest Suite
        env:
          PYTHONPATH: .:backend/src:ai_service
          ENVIRONMENT: test
          SECRET_KEY: test-secret-key-32-bytes-long-for-testing-only
          JWT_SECRET_KEY: test-secret-key-32-bytes-long-for-testing-only
          CRON_SECRET: test-cron-secret-32-chars-long
          REQUIRE_REDIS: 'false'
        run: |
          uv run --project backend --locked --extra dev pytest \
            backend/tests/test_storage.py \
            backend/tests/test_alert_service.py \
            backend/tests/test_feedback_service.py \
            backend/tests/test_expert_service.py \
            backend/tests/test_token_rotation.py \
            backend/tests/test_expert_concurrency.py \
            backend/tests/test_auth.py \
            backend/tests/test_farm_boundaries.py \
            backend/tests/test_media_authorization.py \
            backend/tests/test_admin_management.py \
            backend/tests/test_system_health.py \
            backend/tests/test_mlops_export.py \
            backend/tests/test_model_registry_db.py \
            backend/tests/test_golden_benchmark.py \
            backend/tests/test_internal_cron.py \
            backend/tests/test_ai_service_client.py \
            backend/tests/test_agronomic_advisory.py \
            backend/tests/test_image_validation.py \
            backend/tests/test_worker_queue.py \
            backend/tests/test_backup_restore.py \
            backend/tests/test_paths.py \
            ai_service/tests/test_confidence.py \
            -v

  frontend-check:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit dependency vulnerabilities
        run: npm audit --audit-level=high

      - name: Check localization coverage and rendered languages
        run: npm run localization:check

      - name: Type check and production build
        run: npm run build

  api-contract:
    name: OpenAPI Snapshot & TypeScript Contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install uv
        run: pip install uv==0.13.0

      - name: Install locked backend runtime
        run: uv sync --project backend --locked --no-dev

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            tools/openapi-codegen/package-lock.json

      - name: Install locked OpenAPI code generator
        run: npm ci --prefix tools/openapi-codegen

      - name: Audit OpenAPI code generator dependencies
        run: npm audit --prefix tools/openapi-codegen --audit-level=high

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Regenerate OpenAPI and client contracts
        env:
          PYTHONPATH: backend/src:ai_service
          ENVIRONMENT: test
          SECRET_KEY: openapi-schema-generation-secret-key
          JWT_SECRET_KEY: openapi-schema-generation-jwt-secret
          CRON_SECRET: openapi-schema-generation-cron-secret
          REQUIRE_REDIS: 'false'
        run: |
          uv run --project backend --locked --no-dev \
            python backend/scripts/export_openapi.py
          npm --prefix frontend run api:types
          bash tools/openapi-codegen/generate-dart.sh
          git diff --exit-code -- \
            Docs/openapi.json \
            frontend/src/api/generated/openapi.d.ts \
            mobile/api_client \
            mobile/pubspec.yaml \
            mobile/pubspec.lock

      - name: Verify mobile client dependency lock
        working-directory: mobile
        run: flutter pub get --enforce-lockfile

  secret-scan:
    name: Scan Repository for Secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout repository history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan for leaked credentials
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  mobile-analyze:
    name: Mobile Flutter Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze Flutter codebase
        run: flutter analyze --no-fatal-infos

      - name: Run Flutter unit & widget tests
        run: flutter test
