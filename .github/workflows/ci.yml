name: Continuous Integration & Verification

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'ai_service/**'
      - 'frontend/**'
      - 'mobile/**'
      - '.github/workflows/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database-migration-test:
    name: Alembic PostgreSQL Migration & Reversibility Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_smart_farming
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install uv==0.13.0
          uv sync --project backend --locked --no-dev

      - name: Test Migration Cycle (Upgrade -> Downgrade -> Upgrade)
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_smart_farming
          PYTHONPATH: backend/src:ai_service
        run: |
          cd backend
          echo "Step 1: Upgrade to head..."
          uv run --project . --locked --no-dev alembic upgrade head
          echo "Step 2: Downgrade to base..."
          uv run --project . --locked --no-dev alembic downgrade base
          echo "Step 3: Re-upgrade to head..."
          uv run --project . --locked --no-dev alembic upgrade head
          echo "Alembic migrations verified successfully!"

  backend-tests:
    name: Backend Tests & Rigor
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install uv==0.13.0
          uv sync --project backend --locked --extra dev

      - name: Audit locked backend runtime dependencies
        run: |
          uv export --project backend --locked --no-dev --no-emit-project \
            --format requirements-txt --output-file "$RUNNER_TEMP/backend-requirements.txt"
          uv run --project backend --locked --extra dev pip-audit \
            --requirement "$RUNNER_TEMP/backend-requirements.txt" \
            --require-hashes --disable-pip --progress-spinner off

      - name: Run Pytest Suite
        env:
          PYTHONPATH: .:backend/src:ai_service
          ENVIRONMENT: test
          SECRET_KEY: test-secret-key-32-bytes-long-for-testing-only
          JWT_SECRET_KEY: test-secret-key-32-bytes-long-for-testing-only
          CRON_SECRET: test-cron-secret-32-chars-long
          REQUIRE_REDIS: 'false'
        run: |
          uv run --project backend --locked --extra dev pytest \
            backend/tests/test_storage.py \
            backend/tests/test_token_rotation.py \
            backend/tests/test_expert_concurrency.py \
            backend/tests/test_auth.py \
            backend/tests/test_farm_boundaries.py \
            backend/tests/test_media_authorization.py \
            backend/tests/test_admin_management.py \
            backend/tests/test_system_health.py \
            backend/tests/test_mlops_export.py \
            backend/tests/test_model_registry_db.py \
            backend/tests/test_golden_benchmark.py \
            backend/tests/test_internal_cron.py \
            backend/tests/test_ai_service_client.py \
            backend/tests/test_agronomic_advisory.py \
            backend/tests/test_image_validation.py \
            -v

  frontend-check:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit dependency vulnerabilities
        run: npm audit --audit-level=high

      - name: Type check and production build
        run: npm run build

  mobile-analyze:
    name: Mobile Flutter Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze Flutter codebase
        run: flutter analyze --no-fatal-infos

      - name: Run Flutter unit & widget tests
        run: flutter test
