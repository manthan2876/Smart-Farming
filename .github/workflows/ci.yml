name: Continuous Integration & Verification

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'mobile/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend Tests & Rigor
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest pytest-mock

      - name: Run Pytest Suite
        env:
          PYTHONPATH: backend/src:ai_service
          ENVIRONMENT: test
          SECRET_KEY: test-secret-key-32-bytes-long-for-testing-only
          JWT_SECRET_KEY: test-secret-key-32-bytes-long-for-testing-only
        run: |
          pytest \
            backend/tests/test_storage.py \
            backend/tests/test_token_rotation.py \
            backend/tests/test_expert_concurrency.py \
            backend/tests/test_auth.py \
            backend/tests/test_farm_boundaries.py \
            backend/tests/test_media_authorization.py \
            backend/tests/test_admin_management.py \
            backend/tests/test_system_health.py \
            backend/tests/test_mlops_export.py \
            backend/tests/test_model_registry_db.py \
            backend/tests/test_golden_benchmark.py \
            -v

  frontend-check:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check and production build
        run: npm run build

  mobile-analyze:
    name: Mobile Flutter Analysis
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze Flutter codebase
        run: flutter analyze --no-fatal-infos

      - name: Run Flutter unit & widget tests
        run: flutter test


