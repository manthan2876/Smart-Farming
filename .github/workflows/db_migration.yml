name: Migrate Dev Database to Production

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'backend/alembic/**'
      - 'backend/src/app/models/**'
      - 'backend/scripts/migrate_to_prod.py'

jobs:
  migrate_to_production:
    name: Migrate Dev Database to Production
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || contains(github.event.head_commit.message, '[migrate-db]')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Execute Migration to Production
        env:
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          if [ -z "$PROD_DATABASE_URL" ]; then
            echo "::error::PROD_DATABASE_URL secret is not configured in GitHub Repository Secrets!"
            echo "Please go to: Repository Settings -> Secrets and variables -> Actions -> New repository secret -> PROD_DATABASE_URL"
            exit 1
          fi

          echo "========================================================"
          echo "Migrating Dev Schema & Alembic Revisions to Production..."
          echo "Triggered By: ${{ github.event_name }}"
          echo "========================================================"

          python backend/scripts/migrate_to_prod.py --schema-only --yes
