name: Migrate Database to Production

on:
  workflow_run:
    workflows: ["Continuous Integration & Verification"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: prod-migration
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate_to_production:
    name: Migrate Production Database
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production        # Required reviewer approval gate in GitHub Settings
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install UV and Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install uv==0.13.0
          uv sync --project backend --locked --no-dev

      - name: Install PostgreSQL Client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client

      - name: Pre-Migration Production Database Backup (pg_dump)
        env:
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          if [ -z "$PROD_DATABASE_URL" ]; then
            echo "::error::PROD_DATABASE_URL is not configured in environment secrets"; exit 1
          fi
          mkdir -p backups
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          DUMP_FILE="backups/prod_backup_${{ github.sha }}_${TIMESTAMP}.dump"
          echo "Dumping production database to $DUMP_FILE prior to migration..."
          pg_dump "$PROD_DATABASE_URL" -Fc -f "$DUMP_FILE" || {
            echo "::warning::pg_dump failed. Check postgresql client version compatibility."
          }

      - name: Upload Backup Artifact
        uses: actions/upload-artifact@v7
        with:
          name: prod-db-backup-${{ github.sha }}
          path: backups/*.dump
          retention-days: 7
          if-no-files-found: ignore

      - name: Apply Production Alembic Migrations
        env:
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          PYTHONPATH: backend/src:ai_service
        run: |
          uv run --project backend --locked --no-dev python backend/scripts/migrate_to_prod.py --schema-only --yes
