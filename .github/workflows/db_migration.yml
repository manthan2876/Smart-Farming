name: Database Migration Pipeline

on:
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Target Environment'
        required: true
        type: choice
        default: 'both'
        options:
          - 'both'
          - 'production'
          - 'development'
      action:
        description: 'Select Migration Action'
        required: true
        type: choice
        default: 'schema_only'
        options:
          - 'schema_only'
          - 'seed'
          - 'sync_dev_to_prod'
          - 'sync_prod_to_dev'
          - 'check'
  push:
    branches:
      - main
    paths:
      - 'backend/alembic/**'
      - 'backend/src/app/models/**'
      - 'backend/scripts/migrate_to_prod.py'

jobs:
  migrate:
    name: Run Database Migration
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || contains(github.event.head_commit.message, '[migrate-db]')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Execute Migration Script
        env:
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          DEV_DATABASE_URL: ${{ secrets.DEV_DATABASE_URL || secrets.DATABASE_URL }}
        run: |
          if [ -z "$PROD_DATABASE_URL" ] && [ -z "$DEV_DATABASE_URL" ]; then
            echo "::error::Neither PROD_DATABASE_URL nor DEV_DATABASE_URL secret is configured in GitHub Repository Secrets!"
            echo "Please configure secrets in: Repository Settings -> Secrets and variables -> Actions"
            exit 1
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ACTION="${{ github.event.inputs.action }}"
            TARGET_ENV="${{ github.event.inputs.target_env }}"
          else
            ACTION="schema_only"
            TARGET_ENV="both"
          fi

          echo "========================================================"
          echo "Executing Database Action: $ACTION on Target: $TARGET_ENV"
          echo "Triggered By: ${{ github.event_name }}"
          echo "========================================================"

          if [ "$ACTION" = "check" ]; then
            python backend/scripts/migrate_to_prod.py --check
          elif [ "$ACTION" = "sync_dev_to_prod" ]; then
            python backend/scripts/migrate_to_prod.py --sync-data --yes
          elif [ "$ACTION" = "sync_prod_to_dev" ]; then
            python backend/scripts/migrate_to_prod.py --sync-to-dev --yes
          elif [ "$ACTION" = "seed" ]; then
            if [ "$TARGET_ENV" = "both" ]; then
              python backend/scripts/migrate_to_prod.py --all-dbs --seed --seed-dev --yes
            elif [ "$TARGET_ENV" = "development" ]; then
              python backend/scripts/migrate_to_prod.py --dev-only --seed-dev --yes
            else
              python backend/scripts/migrate_to_prod.py --seed --yes
            fi
          elif [ "$ACTION" = "schema_only" ]; then
            if [ "$TARGET_ENV" = "both" ]; then
              if [ -n "$DEV_DATABASE_URL" ] && [ -n "$PROD_DATABASE_URL" ]; then
                python backend/scripts/migrate_to_prod.py --all-dbs --yes
              elif [ -n "$DEV_DATABASE_URL" ]; then
                python backend/scripts/migrate_to_prod.py --dev-only --yes
              else
                python backend/scripts/migrate_to_prod.py --schema-only --yes
              fi
            elif [ "$TARGET_ENV" = "development" ]; then
              python backend/scripts/migrate_to_prod.py --dev-only --yes
            else
              python backend/scripts/migrate_to_prod.py --schema-only --yes
            fi
          else
            echo "::error::Unknown action: $ACTION"
            exit 1
          fi
