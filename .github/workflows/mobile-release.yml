name: Mobile App Release Build

on:
  workflow_dispatch:
    inputs:
      build_target:
        description: 'Target binary artifact'
        required: true
        default: 'appbundle'
        type: choice
        options:
          - appbundle
          - apk
      flavor:
        description: 'Build flavor environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: read

jobs:
  build-android-release:
    name: Build Signed Android Release Artifact
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Run pre-release Flutter verification
        run: |
          flutter analyze --no-fatal-infos
          flutter test

      - name: Configure Android signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
            cat <<EOF > android/key.properties
          storeFile=release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
            echo "[INFO] Production signing keystore configured."
          else
            echo "[WARNING] No signing secrets found; build will proceed in unsigned release mode."
          fi

      - name: Build Android App Bundle (AAB) with Obfuscation
        if: ${{ github.event.inputs.build_target != 'apk' }}
        run: |
          flutter build appbundle --release \
            --obfuscate \
            --split-debug-info=build/app/outputs/symbols

      - name: Build Android APK with Obfuscation
        if: ${{ github.event.inputs.build_target == 'apk' }}
        run: |
          flutter build apk --release \
            --obfuscate \
            --split-debug-info=build/app/outputs/symbols

      - name: Upload Android App Bundle
        if: ${{ github.event.inputs.build_target != 'apk' }}
        uses: actions/upload-artifact@v7
        with:
          name: smart-farming-release-bundle
          path: mobile/build/app/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Upload Android APK
        if: ${{ github.event.inputs.build_target == 'apk' }}
        uses: actions/upload-artifact@v7
        with:
          name: smart-farming-release-apk
          path: mobile/build/app/outputs/flutter-apk/*.apk
          retention-days: 30

      - name: Upload Split Debug Symbols
        uses: actions/upload-artifact@v7
        with:
          name: smart-farming-debug-symbols
          path: mobile/build/app/outputs/symbols/
          retention-days: 30

