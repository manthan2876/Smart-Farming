name: Deploy AI Service to Hugging Face Space

on:
  workflow_run:
    workflows: ["Continuous Integration & Verification"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-to-huggingface:
    name: Deploy to Hugging Face Space Mirror
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production        # Required reviewer approval gate in GitHub Settings
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Deploy ai_service to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::Secret HF_TOKEN is not configured in GitHub repository secrets. Please add HF_TOKEN under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          # Prevent downloading large Git LFS weights during clone
          export GIT_LFS_SKIP_SMUDGE=1

          echo "Cloning Space deployment mirror with secure header authorization..."
          git -c http.extraheader="Authorization: Bearer $HF_TOKEN" clone --depth 1 https://huggingface.co/spaces/Maharsh8805/smart-farming-ai hf_mirror

          echo "Synchronizing ai_service source files..."
          for f in app.py requirements.txt README.md advisory_kb.json packages.txt; do
            if [ -f "ai_service/$f" ]; then
              cp "ai_service/$f" "hf_mirror/$f"
            fi
          done

          # Only copy config.yaml if it does not already exist on Space, preserving active model promotions
          if [ ! -f "hf_mirror/config.yaml" ] && [ -f "ai_service/config.yaml" ]; then
            echo "Initializing config.yaml on Hugging Face Space..."
            cp "ai_service/config.yaml" "hf_mirror/config.yaml"
          fi

          # Purge unused Dockerfile, obsolete main.py, and any compiled bytecode from Space mirror
          rm -f hf_mirror/Dockerfile hf_mirror/main.py
          find hf_mirror -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
          find hf_mirror -type f -name "*.pyc" -delete 2>/dev/null || true

          for dir in core routers vision_engine training; do
            if [ -d "ai_service/$dir" ]; then
              rsync -rlt --delete --exclude="__pycache__" --exclude="*.pyc" "ai_service/$dir/" "hf_mirror/$dir/"
            fi
          done

          # Synchronize labels and configs without overwriting LFS model weights
          mkdir -p hf_mirror/models
          find ai_service/models -type f \( -name "*.json" -o -name "*.csv" -o -name "*.png" -o -name "*.yaml" \) | while read -r file; do
            rel_path="${file#ai_service/models/}"
            mkdir -p "$(dirname "hf_mirror/models/$rel_path")"
            cp "$file" "hf_mirror/models/$rel_path"
          done

          cd hf_mirror

          # Stage all additions, updates, and removals (__pycache__, Dockerfile)
          git add -A

          if [ -z "$(git status --porcelain)" ]; then
            echo "Hugging Face Space is already up to date. No deployment needed."
            exit 0
          fi

          echo "Pushing updates to Hugging Face Space..."
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "deploy(ai_service): sync from commit ${{ github.sha }}"
          git -c http.extraheader="Authorization: Bearer $HF_TOKEN" push origin main
          echo "Successfully pushed ai_service commit to Hugging Face Space!"

      - name: Polling Post-Deployment Health Check
        run: |
          echo "Polling Hugging Face Space health endpoint..."
          sleep 10
          curl --fail --retry 6 --retry-delay 10 --max-time 30 https://Maharsh8805-smart-farming-ai.hf.space/health || {
            echo "::warning::Space health check returned non-200 or timed out. Space container may still be building."
          }
