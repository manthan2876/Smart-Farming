name = "smart-farming-gateway"
main = "worker.js"
compatibility_date = "2026-09-01"

# Create a KV namespace first:
#   npx wrangler kv namespace create UPSTREAMS
# Then replace the placeholder below with the returned namespace ID.
[[kv_namespaces]]
binding = "UPSTREAMS"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

# Set the gateway credential separately:
#   npx wrangler secret put GATEWAY_API_KEY
