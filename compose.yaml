services:
  backend:
    build:
      context: ./backend
    environment:
      ENVIRONMENT: development
      DEBUG: "true"
      DATABASE_URL: sqlite:////app/data/smart-farming.db
      STORAGE_BACKEND: local
      DATA_ROOT: /app/data
      UPLOAD_ROOT: /app/data/uploads
      PROCESSED_ROOT: /app/data/processed
      AUDIO_ROOT: /app/data/audio
      CORS_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
    ports:
      - "8000:8080"
    volumes:
      - smart-farming-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/ready"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "8080:8080"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  smart-farming-data:
