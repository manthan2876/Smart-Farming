services:
  backend:
    build:
      context: ./backend
    environment:
      ENVIRONMENT: development
      DEBUG: "true"
      DATABASE_URL: sqlite:////app/data/smart-farming.db
      STORAGE_BACKEND: local
      DATA_ROOT: /app/data
      UPLOAD_ROOT: /app/data/uploads
      PROCESSED_ROOT: /app/data/processed
      AUDIO_ROOT: /app/data/audio
      CORS_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
    ports:
      - "8000:8080"
    volumes:
      - smart-farming-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/ready"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "8080:8080"
    depends_on:
      backend:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - smart-farming-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: ./backend
    command: ["arq", "app.worker.WorkerSettings"]
    environment:
      ENVIRONMENT: development
      DEBUG: "true"
      DATABASE_URL: sqlite:////app/data/smart-farming.db
      REDIS_URL: redis://redis:6379
      REQUIRE_REDIS: "true"
      STORAGE_BACKEND: local
      DATA_ROOT: /app/data
      UPLOAD_ROOT: /app/data/uploads
      PROCESSED_ROOT: /app/data/processed
      AUDIO_ROOT: /app/data/audio
    volumes:
      - smart-farming-data:/app/data
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  smart-farming-data:
  smart-farming-redis:
